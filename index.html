<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMSR SETUP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  <div class="device">
  <div class="notch"></div>
 
  <div class="status-bar">
    <span id="status-time">9:41</span>
    <span id="status-icons">●●●</span>
  </div>
 
  <div class="screen-content">
 
    <div class="app active" data-app="messages" id="app-messages">
      <div class="app-header">Messages</div>
      <div class="message-list" id="message-list"></div>
    </div>
 
    <div class="app" data-app="home" id="app-home">
      <div class="app-header">Home</div>
      <p class="pane-placeholder">Coming later.</p>
    </div>

     <div class="app" data-app="contacts" id="app-contacts">
      <div class="app-header">Contacts</div>
      <p class="pane-placeholder">Coming later.</p>
    </div>
 
    <div class="app" data-app="gallery" id="app-gallery">
      <div class="app-header">Gallery</div>
      <p class="pane-placeholder">Coming later.</p>
    </div>
 
    <div class="detail-overlay" id="message-detail"></div>
 
    <div class="notif-banner" id="notif-banner">
      <div class="notif-thumb" id="notif-thumb"></div>
      <div>
        <div class="notif-from" id="notif-from">—</div>
        <div class="notif-snippet" id="notif-snippet">—</div>
      </div>
    </div>
 
  </div>
 
  <div class="dock">
    <button data-app="home">Home</button>
    <button data-app="gallery">Gallery</button>
    <button data-app="contacts">Contacts</button>
    <button data-app="messages" class="active">Messages<span class="unread-dot" id="dock-unread"></span></button>
  </div>
</div>
 
<!-- demo-only: simulates a message "arriving" so you can see the notification flow.
     remove this button for the real install — a real trigger (timer/proximity/etc) replaces it. -->
<!-- <button id="notify-trigger" style="position:fixed; bottom:20px; left:20px; font-family:monospace;">+ simulate arrival</button> -->
 
<script src="js/app.js"></script>
</body>
</html>
