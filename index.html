<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMSR SETUP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <section class="screen active centered-screen" data-screen="intro">
        <p data-i18n="intro.text">Introduction Here</p>
        <button class="btn" id="intro-continue" data-i18n="intro.continue">Continue</button>
      </section>

      <section class="screen centered-screen" data-screen="lock">
        <p>Login screen</p>
        <button class="btn" id="unlock-btn" data-i18n="lock.enter">Enter</button>
      </section>

      <section class="screen centered-screen" data-screen="prompt">
        <p data-i18n="prompt.heading">preliminary prompt</p>
        <button class="btn" id="prompt-continue" data-i18n="prompt.continue">
          Continue
        </button>
      </section>

      <section class="screen" data-screen="os">
        <div class="status-bar">
          <div class="traffic-lights">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <span>archive</span>
        </div>

        <div class="app-frame">
          <div class="app active" data-app="home">
            <p>Home app placeholder</p>
          </div>
          <div class="app" data-app="gallery">
            <div class="gallery-grid" id="gallery-grid"></div>
          </div>
          <div class="app" data-app="messages">
            <div class="pane-layout">
              <div class="pane-sidebar" id="message-list"></div>
              <div class="pane-detail" id="message-detail">
                <p class="pane-placeholder">Select a message to read it</p>
              </div>
            </div>
          </div>
        </div>

        <div class="dock">
          <button class="active" data-app="home">Home</button>
          <button data-app="gallery">Gallery</button>
          <button data-app="messages">Messages</button>
        </div>
      </section>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
