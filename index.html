<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where My Street Remains</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/film.css">

</head>
<body>

  <section class="scene" id="scene-film">
    <div class="frame" id="start" data-manual >
            <button data-next id="begin" >Begin</button>
    </div>

    <div class="frame" id="street">
        <video id="alNasrVid" loop preload>
            <source src="assets/video/street-dolly2.mp4" type="video/mp4"/>
        </video>
        <p class="caption">
            This is Al-Nasr Street in Gaza, Palestine, where our story begins.
        </p>
    </div>

    <div class="frame" id="map">
        <!-- adding map here (shud we do img or load mapbox?) -->
         <p class="caption">One of the cafes on Al Nasr street is Baba Roti</p>
    </div>

    <div class="frame" id="remember" data-manual>
        <h2>How do you remember a city?</h2>
        <div class="choice-buttons">
            <button data-choice="places">Places</button>
            <button data-choice="people">People</button>
        </div>

    </div>
     <nav class="film-nav">
    <button data-back >←</button>
    <div id="film-dots"></div>
    <button data-next>→</button>
  </nav>
  </section>

  <section class="scene" id="scene-desktop">
    <p>desktop goes here</p>
  </section>




  <script type="module" src="js/main.js"></script>
</body>
</html>
